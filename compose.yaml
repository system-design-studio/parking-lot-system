services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: parking_lot
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U parking -d parking_lot' ]
      interval: 5s
      timeout: 3s
      retries: 5
