spring.application.name=parking-lot-system

# --- Docker Compose integration -------------------------------------------------
# The spring-boot-docker-compose dependency auto-starts compose.yaml (Postgres)
# and wires the datasource for us on startup. Explicit values below act as a
# fallback / documentation if you point at an externally managed database.
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop

spring.datasource.url=jdbc:postgresql://localhost:5432/parking_lot
spring.datasource.username=parking
spring.datasource.password=parking

# --- JPA / Hibernate ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Pricing (per-hour rates by spot type, in minor currency units) -------------
parking.pricing.base-fee=0
parking.pricing.free-minutes=15
parking.pricing.hourly-rates.MOTORCYCLE=10
parking.pricing.hourly-rates.COMPACT=20
parking.pricing.hourly-rates.LARGE=30
parking.pricing.hourly-rates.ELECTRIC=25
parking.pricing.hourly-rates.HANDICAPPED=20

# --- Sample data seeding (set false to disable) ---------------------------------
parking.seed.enabled=true
