# Test profile: in-memory H2 (Postgres compatibility mode), no Docker, no seeding.
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:parking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

parking.seed.enabled=false

parking.pricing.base-fee=0
parking.pricing.free-minutes=15
parking.pricing.hourly-rates.MOTORCYCLE=10
parking.pricing.hourly-rates.COMPACT=20
parking.pricing.hourly-rates.LARGE=30
parking.pricing.hourly-rates.ELECTRIC=25
parking.pricing.hourly-rates.HANDICAPPED=20
